[package]
name = "alligator"
version = "0.1.0"
edition = "2024"

[features]
default = []
yubikey-auth = ["dep:yubikey"]

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
crossterm = "0.29"
rand = "0.8"
ratatui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yubikey = { version = "0.9.0-pre.0", optional = true }
zeroize = "1"
